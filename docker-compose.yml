services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cornerroom
      POSTGRES_PASSWORD: cornerroom
      POSTGRES_DB: cornerroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornerroom -d cornerroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["api"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cornerroom:cornerroom@postgres:5432/cornerroom
      DATABASE_URL_SYNC: postgresql+psycopg://cornerroom:cornerroom@postgres:5432/cornerroom
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./var/storage:/app/var/storage

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cornerroom:cornerroom@postgres:5432/cornerroom
      DATABASE_URL_SYNC: postgresql+psycopg://cornerroom:cornerroom@postgres:5432/cornerroom
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
