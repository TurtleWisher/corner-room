# Checks every pull request and every push to main (deploy readiness, 2026-10-23).
# Protect main in GitHub (Settings > Branches): require these checks to pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -m "not postgres" -q
        env:
          APP_ENV: test

  api-postgres:
    name: API database tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cornerroom
          POSTGRES_PASSWORD: cornerroom
          POSTGRES_DB: cornerroom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cornerroom -d cornerroom_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://cornerroom:cornerroom@localhost:5432/cornerroom_test
      DATABASE_URL: postgresql+asyncpg://cornerroom:cornerroom@localhost:5432/cornerroom_test
      DATABASE_URL_SYNC: postgresql+psycopg://cornerroom:cornerroom@localhost:5432/cornerroom_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m postgres -q

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  images:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t cornerroom-api:ci .
      - run: docker build -f apps/web/Dockerfile -t cornerroom-web:ci apps/web
