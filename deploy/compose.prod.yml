# Corner Room production stack (deploy readiness, 2026-10-23; zero-downtime colours 2026-10-30).
# Always run through deploy/scripts/deploy.sh on the server: it builds, backs up, migrates, starts
# the new release next to the live one, switches the edge proxy over, then stops the old one.
#
# nginx on the host is the only way in. The edge container owns 127.0.0.1:3000 (site) and :8000
# (API) and forwards to the live colour: api-blue/web-blue or api-green/web-green. Postgres, Redis
# and the colour containers are not published at all. Secrets come from .env.production (never
# committed). A staging copy uses its own clone, COMPOSE_PROJECT_NAME and EDGE_*_PORT values.

name: ${COMPOSE_PROJECT_NAME:-cornerroom}

# Container logs are rotated (3 x 20 MB each) so a busy server's disk never fills with logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-api-env: &api-env
  APP_ENV: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: local
  STORAGE_LOCAL_PATH: /app/var/storage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # Memory settings for a server with 8 GB or more (the defaults assume 128 MB). Raise with RAM:
    # shared_buffers about a quarter of RAM, effective_cache_size about half (collaborator guide).
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - log_min_duration_statement=${PG_SLOW_QUERY_MS:-1000}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One API and one web app per colour; deploy.sh decides which colour is live. Images are built
  # by deploy.sh (cornerroom-api:<release>, cornerroom-web:<release>).
  api-blue: &api
    image: cornerroom-api:${BLUE_RELEASE:-none}
    command: ["api"]
    restart: unless-stopped
    logging: *logging
    env_file: ../.env.production
    environment: &api-colour-env
      <<: *api-env
      # Migrations run once in deploy.sh before the new version starts.
      RUN_MIGRATIONS: "0"
      SENTRY_RELEASE: ${BLUE_RELEASE:-none}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Per process: 3 API processes x (8 + 4) per colour; two colours overlap for a minute during a
      # deploy, still well below Postgres' 100 connections with the worker.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
    volumes:
      - storage:/app/var/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      start_period: 40s
      retries: 3

  api-green:
    <<: *api
    image: cornerroom-api:${GREEN_RELEASE:-none}
    environment:
      <<: *api-colour-env
      SENTRY_RELEASE: ${GREEN_RELEASE:-none}

  worker:
    image: cornerroom-api:${RELEASE:-none}
    command: ["worker"]
    restart: unless-stopped
    logging: *logging
    # Audio conversion can use every core; two are enough for the worker and leave the rest for
    # visitors (the API has 3 processes on the 6-core server).
    cpus: ${WORKER_CPUS:-2.0}
    env_file: ../.env.production
    environment:
      <<: *api-env
      SENTRY_RELEASE: ${RELEASE:-none}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
    # The worker checks and converts uploads: it must see the same files as the API.
    volumes:
      - storage:/app/var/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-blue: &web
    image: cornerroom-web:${BLUE_RELEASE:-none}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production

  web-green:
    <<: *web
    image: cornerroom-web:${GREEN_RELEASE:-none}

  # Holds the public ports for the whole life of the server, so a deploy never closes them.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${EDGE_API_PORT:-8000}:8000"
      - "127.0.0.1:${EDGE_WEB_PORT:-3000}:3000"
    volumes:
      - ./edge/conf.d:/etc/nginx/conf.d:ro

volumes:
  pgdata:
  redisdata:
  storage:
