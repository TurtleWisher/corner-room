# nginx site for www.cornerroom.live (deploy readiness, 2026-10-23).
# Install: copy to /etc/nginx/sites-available/cornerroom, link into sites-enabled, `nginx -t`,
# `systemctl reload nginx`. Certificates come from certbot (`certbot --nginx -d cornerroom.live
# -d www.cornerroom.live`); adjust the two ssl_ lines if yours live elsewhere.
#
# One address for everything: /api/ goes to the API container, the rest to the web container.
# Both listen on 127.0.0.1 only (deploy/compose.prod.yml).

# Cloudflare (when "www" is proxied, orange cloud): believe its visitor address. Keep the list in
# step with https://www.cloudflare.com/ips/ . Harmless while the site is not proxied.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream cornerroom_web { server 127.0.0.1:3000; keepalive 32; }
upstream cornerroom_api { server 127.0.0.1:8000; keepalive 32; }

# http -> https, bare domain -> www
server {
    listen 80;
    listen [::]:80;
    server_name cornerroom.live www.cornerroom.live;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.cornerroom.live$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cornerroom.live;
    ssl_certificate     /etc/letsencrypt/live/cornerroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cornerroom.live/privkey.pem;
    return 301 https://www.cornerroom.live$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cornerroom.live;

    ssl_certificate     /etc/letsencrypt/live/cornerroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cornerroom.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    # Upload parts are 8 MiB (UPLOAD_PART_SIZE_BYTES); leave headroom.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # API: it sets its own security headers (Phase 15 Gate 4).
    location /api/ {
        proxy_pass http://cornerroom_api;
        proxy_read_timeout 120s;
    }
    # Audio and downloads stream in chunks with range requests: no buffering, long reads.
    location ~ ^/api/v1/(playback/media|downloads)/ {
        proxy_pass http://cornerroom_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # Built assets carry a content hash in their name: cache them for a year.
    location /_next/static/ {
        proxy_pass http://cornerroom_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pages. Security headers for the web app (Phase 15 Gate 5 adds a Content-Security-Policy later).
    location / {
        proxy_pass http://cornerroom_web;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
