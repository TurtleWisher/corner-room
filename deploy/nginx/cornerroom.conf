# nginx site for www.cornerroom.live (deploy readiness, 2026-10-23).
# Install: copy to /etc/nginx/sites-available/cornerroom, link into sites-enabled, `nginx -t`,
# `systemctl reload nginx`. Certificates come from certbot (`certbot --nginx -d cornerroom.live
# -d www.cornerroom.live`); adjust the two ssl_ lines if yours live elsewhere.
#
# One address for everything: /api/ goes to the API container, the rest to the web container.
# Both listen on 127.0.0.1 only (deploy/compose.prod.yml).

# Cloudflare (when "www" is proxied, orange cloud): believe its visitor address. Keep the list in
# step with https://www.cloudflare.com/ips/ . Harmless while the site is not proxied.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Rate limit (owner, 2026-10-24, D-RATE-01): 20 requests per second per visitor address, bursts of
# 40, answered with 429 beyond that. Not counted: the site's own built files (a first visit loads
# about 25 at once; they are cached for a year) and audio/download streams (the "looser rule", so
# playback is never cut; those links are short-lived and the API rechecks access on every chunk).
# The API also limits sign-in (10 per 15 minutes) and downloads (30 per hour) itself.
# Requests made on the server itself (a load test run there, health checks) are not limited.
geo $cr_rate_exempt {
    default    0;
    127.0.0.1  1;
    ::1        1;
}
map "$cr_rate_exempt:$uri" $cr_rate_key {
    ~^1:                                       "";
    ~^0:/_next/static/                         "";
    ~^0:/api/v1/(playback/media|downloads)/    "";
    default                                    $binary_remote_addr;
}
limit_req_zone $cr_rate_key zone=cr_per_ip:20m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

# Idle connections to the apps are dropped after 4 s, before the apps drop them (Node and uvicorn
# close idle connections after 5 s); otherwise nginx can reuse a closed one and show a random 502.
upstream cornerroom_web { server 127.0.0.1:3000; keepalive 32; keepalive_timeout 4s; }
upstream cornerroom_api { server 127.0.0.1:8000; keepalive 32; keepalive_timeout 4s; }

# Public cover pictures are the same for everyone (the API marks them public for an hour): nginx keeps
# a copy so the API doesn't redraw them for every visitor. Signed (private) links are never cached.
proxy_cache_path /var/cache/nginx/cornerroom levels=1:2 keys_zone=cr_covers:10m max_size=2g inactive=7d use_temp_path=off;

# http -> https, bare domain -> www
server {
    listen 80;
    listen [::]:80;
    server_name cornerroom.live www.cornerroom.live;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.cornerroom.live$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cornerroom.live;
    ssl_certificate     /etc/letsencrypt/live/cornerroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cornerroom.live/privkey.pem;
    return 301 https://www.cornerroom.live$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cornerroom.live;

    ssl_certificate     /etc/letsencrypt/live/cornerroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cornerroom.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    # Upload parts are 8 MiB (UPLOAD_PART_SIZE_BYTES); leave headroom.
    client_max_body_size 16m;
    # Slow-sender protection: a client that sends its headers or body too slowly is dropped
    # (the body timeout is between two reads, not the whole upload).
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;

    limit_req zone=cr_per_ip burst=40 nodelay;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The visitor's address only (after the Cloudflare step above), never a header the visitor sent,
    # so the API's sign-in limit can't be dodged with a made-up address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # API: it sets its own security headers (Phase 15 Gate 4).
    location /api/ {
        proxy_pass http://cornerroom_api;
        proxy_read_timeout 120s;
    }
    location ~ ^/api/v1/covers/(releases|tracks|events|artists|bands)/ {
        proxy_pass http://cornerroom_api;
        proxy_cache cr_covers;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache $upstream_cache_status always;
    }
    # Audio and downloads stream in chunks with range requests: no buffering, long reads.
    location ~ ^/api/v1/(playback/media|downloads)/ {
        proxy_pass http://cornerroom_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # Built assets carry a content hash in their name: cache them for a year.
    location /_next/static/ {
        proxy_pass http://cornerroom_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pages. Security headers for the web app; the Content-Security-Policy comes from the app itself
    # (next.config.ts, Phase 15 Gate 5).
    location / {
        proxy_pass http://cornerroom_web;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
