# nginx site for the private staging copy, staging.cornerroom.live (2026-10-30). Installed once by
# deploy/scripts/staging-setup.sh. Uses the rate limit and Cloudflare settings defined in
# cornerroom.conf (same nginx), so both files must be enabled.
#
# Password protected (auth_basic) and never indexed: staging is for trying changes before they go
# live, not for visitors. Its edge container listens on 127.0.0.1:3100 (site) and :8100 (API).

upstream cornerroom_staging_web { server 127.0.0.1:3100; keepalive 16; keepalive_timeout 4s; }
upstream cornerroom_staging_api { server 127.0.0.1:8100; keepalive 16; keepalive_timeout 4s; }

server {
    listen 80;
    listen [::]:80;
    server_name staging.cornerroom.live;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://staging.cornerroom.live$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.cornerroom.live;

    ssl_certificate     /etc/letsencrypt/live/staging.cornerroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.cornerroom.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 16m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    limit_req zone=cr_per_ip burst=40 nodelay;

    auth_basic "Corner Room staging";
    auth_basic_user_file /etc/nginx/cornerroom-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # The API carries its own sign-in token in the Authorization header, which the browser would
    # otherwise use for the staging password; the API checks access itself, the pages stay locked.
    location /api/ {
        auth_basic off;
        proxy_pass http://cornerroom_staging_api;
        proxy_read_timeout 120s;
    }
    location ~ ^/api/v1/(playback/media|downloads)/ {
        auth_basic off;
        proxy_pass http://cornerroom_staging_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location / {
        proxy_pass http://cornerroom_staging_web;
    }
}
